<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的人生国家 — 找到你灵魂的归属地</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    /* ===== CSS Variables & Reset ===== */
    :root {
      --primary: #4F46E5;
      --primary-light: #818CF8;
      --primary-dark: #3730A3;
      --accent: #F59E0B;
      --accent-light: #FCD34D;
      --bg-start: #0F172A;
      --bg-end: #1E293B;
      --card-bg: rgba(255,255,255,0.06);
      --card-border: rgba(255,255,255,0.1);
      --text: #F1F5F9;
      --text-muted: #94A3B8;
      --success: #10B981;
      --error: #EF4444;
      --radius: 16px;
      --shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Noto Sans SC', system-ui, sans-serif;
      background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* ===== Animated Background ===== */
    .bg-animation {
      position: fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
    }
    .bg-animation .orb {
      position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.15; animation: float 20s ease-in-out infinite;
    }
    .bg-animation .orb:nth-child(1) { width:600px; height:600px; background:var(--primary); top:-200px; left:-100px; animation-delay:0s; }
    .bg-animation .orb:nth-child(2) { width:400px; height:400px; background:var(--accent); bottom:-100px; right:-50px; animation-delay:-7s; }
    .bg-animation .orb:nth-child(3) { width:300px; height:300px; background:#EC4899; top:50%; left:50%; animation-delay:-14s; }
    @keyframes float {
      0%,100% { transform: translate(0,0) scale(1); }
      33% { transform: translate(30px,-50px) scale(1.05); }
      66% { transform: translate(-20px,40px) scale(0.95); }
    }

    /* ===== Layout ===== */
    .container {
      position: relative; z-index:1;
      max-width: 680px; margin: 0 auto; padding: 40px 20px;
      min-height: 100vh; display:flex; flex-direction:column; justify-content:center;
    }

    /* ===== Card ===== */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 48px 40px;
      box-shadow: var(--shadow);
      animation: cardIn 0.6s cubic-bezier(0.16,1,0.3,1);
    }
    @keyframes cardIn {
      from { opacity:0; transform: translateY(30px) scale(0.97); }
      to { opacity:1; transform: translateY(0) scale(1); }
    }

    /* ===== Typography ===== */
    .logo { font-size:48px; text-align:center; margin-bottom:8px; animation: bounce 2s infinite; }
    @keyframes bounce {
      0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-8px); }
    }
    h1 { font-size:32px; font-weight:900; text-align:center; background:linear-gradient(135deg,var(--primary-light),var(--accent-light)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin-bottom:8px; }
    h2 { font-size:22px; font-weight:700; text-align:center; margin-bottom:6px; }
    .subtitle { text-align:center; color:var(--text-muted); font-size:15px; margin-bottom:32px; }

    /* ===== Form Elements ===== */
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display:block; font-size:14px; font-weight:500; color:var(--text-muted); margin-bottom:6px;
    }
    .form-group label .required { color:var(--error); margin-left:2px; }
    input[type="text"], input[type="date"], input[type="password"], select {
      width:100%; padding:14px 16px; border-radius:12px;
      border:1px solid var(--card-border); background:rgba(255,255,255,0.05);
      color:var(--text); font-size:16px; font-family:inherit; transition:all 0.3s;
      outline:none;
    }
    input:focus, select:focus {
      border-color:var(--primary-light); box-shadow:0 0 0 3px rgba(99,102,241,0.2);
    }
    select option { background:#1E293B; color:var(--text); }

    /* ===== Buttons ===== */
    .btn {
      display:inline-flex; align-items:center; justify-content:center; gap:8px;
      padding:14px 32px; border-radius:12px; border:none;
      font-size:16px; font-weight:600; font-family:inherit; cursor:pointer;
      transition:all 0.3s; position:relative; overflow:hidden;
    }
    .btn-primary {
      background:linear-gradient(135deg,var(--primary),var(--primary-dark));
      color:#fff; width:100%;
    }
    .btn-primary:hover { transform:translateY(-2px); box-shadow:0 10px 30px rgba(79,70,229,0.4); }
    .btn-primary:active { transform:translateY(0); }
    .btn-secondary {
      background:rgba(255,255,255,0.08); color:var(--text); border:1px solid var(--card-border);
    }
    .btn-secondary:hover { background:rgba(255,255,255,0.12); }
    .btn-accent {
      background:linear-gradient(135deg,var(--accent),#D97706);
      color:#fff; width:100%;
    }
    .btn-accent:hover { transform:translateY(-2px); box-shadow:0 10px 30px rgba(245,158,11,0.4); }
    .btn-group { display:flex; gap:12px; margin-top:24px; }
    .btn-group .btn { flex:1; }

    /* ===== Progress Bar ===== */
    .progress-bar { width:100%; height:6px; background:rgba(255,255,255,0.08); border-radius:3px; margin-bottom:32px; overflow:hidden; }
    .progress-bar .fill { height:100%; background:linear-gradient(90deg,var(--primary),var(--accent)); border-radius:3px; transition:width 0.5s cubic-bezier(0.16,1,0.3,1); }

    /* ===== Quiz Options ===== */
    .quiz-question { font-size:20px; font-weight:700; margin-bottom:8px; line-height:1.4; }
    .quiz-hint { font-size:13px; color:var(--text-muted); margin-bottom:20px; }
    .quiz-options { display:flex; flex-direction:column; gap:10px; }
    .quiz-option {
      padding:16px 20px; border-radius:12px; border:1px solid var(--card-border);
      background:rgba(255,255,255,0.03); cursor:pointer; transition:all 0.3s;
      display:flex; align-items:center; gap:12px; font-size:15px;
    }
    .quiz-option:hover { background:rgba(255,255,255,0.08); border-color:var(--primary-light); transform:translateX(4px); }
    .quiz-option.selected { background:rgba(79,70,229,0.15); border-color:var(--primary-light); }
    .quiz-option .opt-icon { font-size:22px; flex-shrink:0; }
    .quiz-option .opt-text { flex:1; }

    /* ===== Result ===== */
    .result-flag { font-size:100px; text-align:center; margin-bottom:16px; animation:bounce 2s infinite; }
    .result-country { font-size:36px; font-weight:900; text-align:center; margin-bottom:4px; background:linear-gradient(135deg,var(--accent-light),var(--accent)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .result-match { text-align:center; color:var(--success); font-size:18px; font-weight:600; margin-bottom:20px; }
    .result-desc { font-size:15px; line-height:1.8; color:var(--text-muted); margin-bottom:24px; text-align:justify; }
    .result-tags { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:24px; }
    .result-tag { padding:6px 14px; border-radius:20px; font-size:13px; font-weight:500; background:rgba(255,255,255,0.06); border:1px solid var(--card-border); }

    .result-detail { margin-bottom:24px; }
    .result-detail-title { font-size:14px; font-weight:600; color:var(--primary-light); margin-bottom:8px; display:flex; align-items:center; gap:6px; }
    .result-detail p { font-size:14px; color:var(--text-muted); line-height:1.7; }

    .dim-scores { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:24px; }
    .dim-score-item { padding:12px; border-radius:10px; background:rgba(255,255,255,0.04); text-align:center; }
    .dim-score-label { font-size:12px; color:var(--text-muted); margin-bottom:4px; }
    .dim-score-value { font-size:20px; font-weight:700; color:var(--primary-light); }

    /* ===== Error Message ===== */
    .error-msg { color:var(--error); font-size:13px; margin-top:6px; display:none; }
    .error-msg.show { display:block; animation:shake 0.4s; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

    /* ===== Transitions ===== */
    .page { display:none; }
    .page.active { display:block; }
    .fade-in { animation: cardIn 0.5s cubic-bezier(0.16,1,0.3,1); }

    /* ===== Responsive ===== */
    @media (max-width:640px) {
      .card { padding:32px 24px; }
      h1 { font-size:26px; }
      .logo { font-size:40px; }
      .result-flag { font-size:80px; }
      .result-country { font-size:28px; }
      .dim-scores { grid-template-columns:1fr; }
    }

    /* ===== Misc ===== */
    .divider { height:1px; background:var(--card-border); margin:24px 0; }
    .step-indicator { text-align:center; font-size:13px; color:var(--text-muted); margin-bottom:16px; }
    .key-info { margin-top:16px; padding:14px; border-radius:10px; background:rgba(245,158,11,0.08); border:1px solid rgba(245,158,11,0.2); font-size:13px; color:var(--accent-light); line-height:1.6; }
    .key-info a { color:var(--accent); text-decoration:underline; }

    /* loading spinner */
    .loading-overlay {
      display:none; position:fixed; inset:0; z-index:999;
      background:rgba(15,23,42,0.85); backdrop-filter:blur(10px);
      justify-content:center; align-items:center; flex-direction:column; gap:20px;
    }
    .loading-overlay.active { display:flex; }
    .spinner { width:56px; height:56px; border:4px solid rgba(255,255,255,0.1); border-top-color:var(--primary-light); border-radius:50%; animation:spin 0.8s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }
    .loading-text { color:var(--text-muted); font-size:16px; }
    .loading-sub { color:var(--text-muted); font-size:13px; opacity:0.6; }
  </style>
</head>
<body>

<div class="bg-animation">
  <div class="orb"></div>
  <div class="orb"></div>
  <div class="orb"></div>
</div>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">正在分析你的灵魂归属...</div>
  <div class="loading-sub">综合 MBTI、星座、性格维度计算中</div>
</div>

<div class="container">

  <!-- ========== PAGE 1: Welcome & Key ========== -->
  <div class="page active" id="page-welcome">
    <div class="card">
      <div class="logo">🌍</div>
      <h1>我的人生国家</h1>
      <p class="subtitle">回答几个问题，找到你灵魂真正的归属地</p>
      <div class="divider"></div>
      <div class="form-group">
        <label>输入你的专属口令 <span class="required">*</span></label>
        <input type="text" id="accessKey" placeholder="例：A7K2-M9X4-Q3W8-P1N6" autocomplete="off" style="text-transform:uppercase; letter-spacing:2px; font-family:monospace,sans-serif;">
        <div class="error-msg" id="keyError">口令无效，请检查后重新输入</div>

      </div>
    </div>
  </div>

  <!-- ========== PAGE 2: User Info ========== -->

        <input type="date" id="userBirthday">
      </div>
      <div class="form-group">
        <label>你的 MBTI 类型 <span class="required">*</span></label>
        <select id="userMBTI">
          <option value="">-- 请选择 --</option>
          <option value="INTJ">INTJ — 建筑师</option>
          <option value="INTP">INTP — 逻辑学家</option>
          <option value="ENTJ">ENTJ — 指挥官</option>
          <option value="ENTP">ENTP — 辩论家</option>
          <option value="INFJ">INFJ — 提倡者</option>
          <option value="INFP">INFP — 调停者</option>
          <option value="ENFJ">ENFJ — 主人公</option>
          <option value="ENFP">ENFP — 竞选者</option>
          <option value="ISTJ">ISTJ — 物流师</option>
          <option value="ISFJ">ISFJ — 守卫者</option>
          <option value="ESTJ">ESTJ — 总经理</option>
          <option value="ESFJ">ESFJ — 执政官</option>
          <option value="ISTP">ISTP — 鉴赏家</option>
          <option value="ISFP">ISFP — 探险家</option>
          <option value="ESTP">ESTP — 企业家</option>
          <option value="ESFP">ESFP — 表演者</option>
        </select>
      </div>
      <div class="form-group">
        <label>你的性别</label>
        <select id="userGender">
          <option value="other">不愿透露</option>
          <option value="male">男</option>
          <option value="female">女</option>
        </select>
      </div>
      <div class="error-msg" id="infoError">请填写所有必填信息哦~</div>
      <button class="btn btn-primary" onclick="submitInfo()">继续 →</button>
    </div>
  </div>

  <!-- ========== PAGE 3: Quiz Questions ========== -->
  <div class="page" id="page-quiz">
    <div class="card">
      <div class="step-indicator">第 2 步 / 共 3 步</div>
      <div class="progress-bar"><div class="fill" id="progressFill" style="width:0%"></div></div>
      <div class="quiz-question" id="quizQuestion"></div>
      <div class="quiz-hint" id="quizHint"></div>
      <div class="quiz-options" id="quizOptions"></div>
      <div class="btn-group" style="margin-top:24px">
        <button class="btn btn-secondary" id="btnPrev" onclick="prevQuestion()" style="display:none">← 上一题</button>
        <button class="btn btn-primary" id="btnNext" onclick="nextQuestion()" disabled>下一题 →</button>
      </div>
    </div>
  </div>

  <!-- ========== PAGE 4: Result ========== -->
  <div class="page" id="page-result">
    <div class="card">
      <div class="step-indicator">🎉 测试完成</div>
      <div class="result-flag" id="resultFlag"></div>
      <div class="result-country" id="resultCountry"></div>
      <div class="result-match" id="resultMatch"></div>
      <div class="result-tags" id="resultTags"></div>
      <div class="divider"></div>
      <div class="result-desc" id="resultDesc"></div>

      <div class="dim-scores" id="dimScores"></div>

      <div class="result-detail" id="resultWhy">
        <div class="result-detail-title">🔍 为什么是这个国家？</div>
        <p id="resultWhyText"></p>
      </div>
      <div class="result-detail" id="resultAdvice">
        <div class="result-detail-title">💡 给你的生活建议</div>
        <p id="resultAdviceText"></p>
      </div>

      <div class="divider"></div>
      <button class="btn btn-accent" onclick="restartTest()">🔄 重新测试</button>
    </div>
  </div>

</div>

// 获取已使用的密钥列表（存储在 localStorage 中）
function getUsedKeys() {
  try {
    return JSON.parse(localStorage.getItem('usedKeys') || '[]');
  } catch { return []; }
}

// 将密钥标记为已使用
function markKeyAsUsed(key) {
  const used = getUsedKeys();
  if (!used.includes(key)) {
    used.push(key);
    localStorage.setItem('usedKeys', JSON.stringify(used));
  }
}

    if ((month === s.m1 && day >= s.d1) || (month === s.m2 && day <= s.d2)) return s.name;
  }
  return '摩羯座';
}

const zodiacModifiers = {
  '白羊座': { adventure:2, social:1, aesthetic:0, pace:1, nature:0, tradition:-1 },
  '金牛座': { adventure:-1, social:0, aesthetic:1, pace:-2, nature:1, tradition:2 },
  '双子座': { adventure:1, social:2, aesthetic:0, pace:1, nature:-1, tradition:-1 },
  '巨蟹座': { adventure:-1, social:1, aesthetic:0, pace:-1, nature:0, tradition:2 },
  '狮子座': { adventure:1, social:2, aesthetic:1, pace:1, nature:0, tradition:0 },
  '处女座': { adventure:-1, social:-1, aesthetic:1, pace:0, nature:0, tradition:2 },
  '天秤座': { adventure:0, social:1, aesthetic:2, pace:-1, nature:0, tradition:0 },
  '天蝎座': { adventure:1, social:-1, aesthetic:1, pace:0, nature:0, tradition:0 },
  '射手座': { adventure:3, social:1, aesthetic:0, pace:0, nature:1, tradition:-2 },
  '摩羯座': { adventure:-1, social:-1, aesthetic:0, pace:1, nature:0, tradition:2 },
  '水瓶座': { adventure:1, social:0, aesthetic:1, pace:0, nature:0, tradition:-2 },
  '双鱼座': { adventure:0, social:0, aesthetic:2, pace:-1, nature:1, tradition:0 }
};

// =============================================
// STATE
// =============================================
let currentPage = 'welcome';
let currentQ = 0;
let answers = [];
let userInfo = {};

// =============================================
// KEY VALIDATION
// =============================================
// 当前会话使用的密钥
let currentSessionKey = null;

function validateKey() {
  const key = document.getElementById('accessKey').value.trim().toUpperCase();
  const err = document.getElementById('keyError');
  const usedKeys = getUsedKeys();

  if (!VALID_KEYS.includes(key)) {
    err.textContent = '口令无效，请检查后重新输入';
    err.classList.add('show');
    document.getElementById('accessKey').focus();
    return;
  }

  if (usedKeys.includes(key)) {
    err.textContent = '该口令已被使用过啦，请输入新的口令';
    err.classList.add('show');
    document.getElementById('accessKey').focus();
    return;
  }

  // 验证通过：记录密钥，标记为已使用
  err.classList.remove('show');
  currentSessionKey = key;
  markKeyAsUsed(key);
  goToPage('info');
}

// =============================================
// PAGE NAVIGATION
// =============================================
function goToPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const target = document.getElementById('page-' + page);
  target.classList.add('active');
  target.classList.remove('fade-in');
  void target.offsetWidth; // reflow
  target.classList.add('fade-in');
  currentPage = page;
  window.scrollTo({ top:0, behavior:'smooth' });
}

// =============================================
// USER INFO SUBMISSION
// =============================================
function submitInfo() {
  const name = document.getElementById('userName').value.trim();
  const birthday = document.getElementById('userBirthday').value;
  const mbti = document.getElementById('userMBTI').value;
  const gender = document.getElementById('userGender').value;
  const err = document.getElementById('infoError');

  if (!name || !birthday || !mbti) {
    err.classList.add('show');
    return;
  }
  err.classList.remove('show');

  userInfo = { name, birthday, mbti, gender };
  currentQ = 0;
  answers = new Array(questions.length).fill(null);
  renderQuestion();
  goToPage('quiz');
}

// =============================================
// QUIZ RENDERING
// =============================================
function renderQuestion() {
  const q = questions[currentQ];
  const total = questions.length;
  const progress = ((currentQ) / total * 100);
  document.getElementById('progressFill').style.width = progress + '%';
  document.getElementById('quizQuestion').textContent = `Q${currentQ+1}. ${q.question}`;
  document.getElementById('quizHint').textContent = q.hint;

  const optContainer = document.getElementById('quizOptions');
  optContainer.innerHTML = '';
  q.options.forEach((opt, idx) => {
    const div = document.createElement('div');
    div.className = 'quiz-option' + (answers[currentQ] === idx ? ' selected' : '');
    div.innerHTML = `<span class="opt-icon">${opt.icon}</span><span class="opt-text">${opt.text}</span>`;
    div.onclick = () => selectOption(idx);
    optContainer.appendChild(div);
  });

  // buttons
  document.getElementById('btnPrev').style.display = currentQ > 0 ? '' : 'none';
  const btnNext = document.getElementById('btnNext');
  btnNext.disabled = answers[currentQ] === null;
  btnNext.textContent = currentQ === total - 1 ? '查看结果 🎉' : '下一题 →';
}

function selectOption(idx) {
  answers[currentQ] = idx;
  document.querySelectorAll('.quiz-option').forEach((el, i) => {
    el.classList.toggle('selected', i === idx);
  });
  document.getElementById('btnNext').disabled = false;
}

function nextQuestion() {
  if (answers[currentQ] === null) return;
  if (currentQ < questions.length - 1) {
    currentQ++;
    renderQuestion();
  } else {
    calculateResult();
  }
}

function prevQuestion() {
  if (currentQ > 0) {
    currentQ--;
    renderQuestion();
  }
}

// =============================================
// CALCULATION ENGINE
// =============================================
function calculateResult() {
  // Show loading
  document.getElementById('loadingOverlay').classList.add('active');

  setTimeout(() => {
    // 1. Tally quiz scores
    const scores = { adventure:0, social:0, aesthetic:0, pace:0, nature:0, tradition:0 };
    questions.forEach((q, qi) => {
      const chosen = q.options[answers[qi]];
      if (chosen && chosen.scores) {
        for (const [dim, val] of Object.entries(chosen.scores)) {
          scores[dim] = (scores[dim] || 0) + val;
        }
      }
    });

    // 2. Add MBTI modifier (weight 0.7)
    const mbtiMod = mbtiModifiers[userInfo.mbti] || {};
    for (const [dim, val] of Object.entries(mbtiMod)) {
      scores[dim] = (scores[dim] || 0) + val * 0.7;
    }

    // 3. Add Zodiac modifier (weight 0.4)
    const bday = new Date(userInfo.birthday);
    const zodiac = getZodiac(bday.getMonth()+1, bday.getDate());
    const zodiacMod = zodiacModifiers[zodiac] || {};
    for (const [dim, val] of Object.entries(zodiacMod)) {
      scores[dim] = (scores[dim] || 0) + val * 0.4;
    }

    // 4. Name hash for minor randomness (weight 0.3)
    let nameHash = 0;
    for (let i = 0; i < userInfo.name.length; i++) nameHash += userInfo.name.charCodeAt(i);
    const dims = Object.keys(scores);
    dims.forEach((d, i) => {
      scores[d] += ((nameHash * (i+1)) % 5 - 2) * 0.3;
    });

    // 5. Match against countries (cosine similarity)
    let bestMatch = null;
    let bestScore = -Infinity;
    const allResults = [];

    countries.forEach(country => {
      let dotProduct = 0, magA = 0, magB = 0;
      for (const dim of dims) {
        const a = scores[dim] || 0;
        const b = country.profile[dim] || 0;
        dotProduct += a * b;
        magA += a * a;
        magB += b * b;
      }
      magA = Math.sqrt(magA);
      magB = Math.sqrt(magB);
      const similarity = (magA && magB) ? dotProduct / (magA * magB) : 0;
      allResults.push({ country, similarity });
      if (similarity > bestScore) {
        bestScore = similarity;
        bestMatch = country;
      }
    });

    // 6. Calculate match percentage (60-98 range)
    const matchPercent = Math.round(60 + (bestScore + 1) / 2 * 38);

    // 7. Render result
    renderResult(bestMatch, matchPercent, scores, zodiac);

    document.getElementById('loadingOverlay').classList.remove('active');
    goToPage('result');
  }, 2200);
}

// =============================================
// RESULT RENDERING
// =============================================
function renderResult(country, matchPercent, scores, zodiac) {
  document.getElementById('resultFlag').textContent = country.flag;
  document.getElementById('resultCountry').textContent = country.name;
  document.getElementById('resultMatch').textContent = `${userInfo.name}，你与${country.name}的契合度高达 ${matchPercent}%！`;

  // Tags
  const tagsEl = document.getElementById('resultTags');
  tagsEl.innerHTML = '';
  country.tags.forEach(tag => {
    const span = document.createElement('span');
    span.className = 'result-tag';
    span.textContent = '#' + tag;
    tagsEl.appendChild(span);
  });

  // Description (personalized)
  document.getElementById('resultDesc').textContent = country.desc;

  // Dimension scores
  const dimLabels = {
    adventure:'冒险指数', social:'社交能量', aesthetic:'美学感知',
    pace:'生活节奏', nature:'自然亲和', tradition:'传统认同'
  };
  const dimEl = document.getElementById('dimScores');
  dimEl.innerHTML = '';
  for (const [dim, label] of Object.entries(dimLabels)) {
    // Normalize to 0-100
    const raw = scores[dim] || 0;
    const normalized = Math.round(Math.max(0, Math.min(100, (raw + 10) / 20 * 100)));
    const item = document.createElement('div');
    item.className = 'dim-score-item';
    item.innerHTML = `<div class="dim-score-label">${label}</div><div class="dim-score-value">${normalized}</div>`;
    dimEl.appendChild(item);
  }

  // Why
  const whyBase = country.why;
  const zodiacNote = `作为${zodiac}和${userInfo.mbti}型人格的${userInfo.name}，`;
  document.getElementById('resultWhyText').textContent = zodiacNote + whyBase;

  // Advice
  document.getElementById('resultAdviceText').textContent = country.advice;
}

// =============================================
// RESTART
// =============================================
function restartTest() {
  currentQ = 0;
  answers = [];
  userInfo = {};
  document.getElementById('userName').value = '';
  document.getElementById('userBirthday').value = '';
  document.getElementById('userMBTI').value = '';
  goToPage('welcome');
}

// =============================================
// Enter key support
// =============================================
document.getElementById('accessKey').addEventListener('keypress', e => { if(e.key==='Enter') validateKey(); });
</script>
